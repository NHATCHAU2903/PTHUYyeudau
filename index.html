<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>women's day</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/css/bootstrap-grid.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    #castle, .body-letter { display:flex; justify-content:center; align-items:center; height:100vh; background-color:#fae1dd; }
    .container { display:flex; justify-content:center; align-items:center; height:97vh; }
    .container svg { width:50%; height:50%; }

    .audio-bar {
      position: fixed; left: 16px; bottom: 16px;
      display:flex; align-items:center; gap:8px;
      padding:8px 12px; background:#ffffffcc; backdrop-filter: blur(6px);
      border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,.15); z-index: 2000;
    }
    .audio-bar button {
      border:0; border-radius:10px; padding:6px 10px; background:#ff8fab; color:#fff; cursor:pointer;
    }

    .letter{ position:relative; z-index:1; }
    .valentines{ position:relative; top:50px; cursor:pointer; animation:up 3s linear infinite; }
    @keyframes up { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-30px);} }

    .envelope{ position:relative; width:300px; height:200px; background-color:#f08080; }
    .envelope:before{ background-color:#f08080; content:""; position:absolute; width:212px; height:212px; transform:rotate(45deg); top:-105px; left:44px; border-radius:30px 0 0 0; }
    .card{ position:absolute; background-color:#eae2b7; width:270px; height:170px; top:5px; left:15px; box-shadow:-5px -5px 100px rgba(0,0,0,0.4); }
    .card:before{ content:""; position:absolute; border:3px dotted #003049; width:240px; height:140px; left:12px; top:12px; }
    .text{ position:absolute; font-family:'Brush Script MT', cursive; font-size:28px; text-align:center; line-height:25px; top:19px; left:85px; color:#003049; }

    .heart{ background-color:#d62828; display:inline-block; height:30px; margin:0 10px; position:relative; top:110px; left:105px; transform:rotate(-45deg); width:30px; }
    .heart:before,.heart:after{ content:""; background-color:#d62828; border-radius:50%; height:30px; position:absolute; width:30px; }
    .heart:before{ top:-15px; left:0; } .heart:after{ left:15px; top:0; }

    .hearts{ position:absolute; top:0 }
    .one,.two,.three,.four,.five{ background-color:red; display:inline-block; height:10px; margin:0 10px; position:relative; transform:rotate(-45deg); width:10px; top:50px; }
    .one:before,.one:after,.two:before,.two:after,.three:before,.three:after,.four:before,.four:after,.five:before,.five:after{ content:""; background-color:red; border-radius:50%; height:10px; position:absolute; width:10px; }
    .one:before,.two:before,.three:before,.four:before,.five:before{ top:-5px; left:0; }
    .one:after,.two:after,.three:after,.four:after,.five:after{ left:5px; top:0; }
    .one{ left:10px; animation:heart 1s ease-out infinite; }
    .two{ left:30px; animation:heart 2s ease-out infinite; }
    .three{ left:50px; animation:heart 1.5s ease-out infinite; }
    .four{ left:70px; animation:heart 2.3s ease-out infinite; }
    .five{ left:90px; animation:heart 1.7s ease-out infinite; }
    @keyframes heart{ 0%{ transform:translateY(0) rotate(-45deg) scale(.3); opacity:1;} 100%{ transform:translateY(-150px) rotate(-45deg) scale(1.3); opacity:.5;} }

    .front{ position:absolute; border-right:180px solid #f4978e; border-top:95px solid transparent; border-bottom:100px solid transparent; left:120px; top:5px; width:0; height:0; z-index:10; }
    .front:before{ position:absolute; content:""; border-left:300px solid #f8ad9d; border-top:195px solid transparent; left:-120px; top:-95px; width:0; height:0; }
    .shadow{ position:absolute; width:330px; height:25px; border-radius:50%; background-color:rgba(0,0,0,0.3); top:265px; left:-15px; animation:scale 3s linear infinite; z-index:-1; }
    @keyframes scale{ 0%,100%{ transform:scaleX(1);} 50%{ transform:scaleX(.85);} }

    .fa-xmark{ position:absolute; right:20px; top:20px; color:#fff; cursor:pointer; font-size:25px; }

    .wrapperLetterForm{ position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:1000; background:rgba(0,0,0,0.7); display:none; }
    .boxLetter{ width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
    .formLetter{ position:relative; width:600px; height:350px; background-color:#FFEBEB; border-radius:20px; z-index:100; padding:20px 15px; box-shadow:rgba(0,0,0,0.24) 0 3px 8px; }
    .wrapperLetter{ position:relative; width:100%; height:100%; border:2px dashed #FF6666; border-radius:inherit; display:flex; }

    .textLetter{ width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; user-select:none; }
    .textLetter h2{ font-size:30px; font-family:'Dancing Script', cursive; }
    .textLetter .contentLetter{
      font-size:19px; text-align:center; padding:0 30px; margin-top:10px; font-family:'Dancing Script', cursive;
      white-space:pre-wrap; max-height:220px; overflow:auto;
    }

    .heartAnimation{ position:absolute; width:200px; bottom:0; }
    .heartAnimation img{ width:100%; }
    .mewmew1,.mewmew2{ position:absolute; width:90px; bottom:0; }
    .mewmew1{ left:0; } .mewmew2{ right:0; }

    svg{ width:80%; display:block; position:absolute; margin:auto; top:0; bottom:0; left:0; right:0; z-index:1; }
    text{ fill:#e6668a; font-family:consolas; font-size:9px; }

    #text-click{ position:absolute; z-index:2; font-family:fantasy; color:indianred; font-size:50px; top:80%; display:none; }
    #yt-holder { position:fixed; width:1px; height:1px; left:-9999px; top:-9999px; }
  </style>
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>

  <script>
    const YT_VIDEO_ID = "D_twEhvSwHY"; 
    let ytPlayer = null;
    let isMuted = false;

    function onYouTubeIframeAPIReady(){
      ytPlayer = new YT.Player('yt-player', {
        videoId: YT_VIDEO_ID,
        playerVars: {
          autoplay: 0,
          controls: 0,
          modestbranding: 1,
          loop: 1,
          playlist: YT_VIDEO_ID,
          rel: 0
        }
      });
    }

    function playBGM(){
      if(ytPlayer && ytPlayer.playVideo){
        ytPlayer.unMute(); // Đảm bảo bật tiếng
        ytPlayer.playVideo();
        document.getElementById('audioBar').style.display = 'flex';
      }
    }

    function stopBGM(){
      if(ytPlayer && ytPlayer.stopVideo){
        ytPlayer.stopVideo();
        document.getElementById('audioBar').style.display = 'none';
      }
    }

    function toggleMute(){
      if(!ytPlayer) return;
      if(isMuted){ 
        ytPlayer.unMute(); 
        isMuted = false; 
        document.getElementById('toggleMute').textContent = 'Mute'; 
      } else { 
        ytPlayer.mute(); 
        isMuted = true; 
        document.getElementById('toggleMute').textContent = 'Unmute'; 
      }
    }

    document.addEventListener('click', e => {
      if(e.target && e.target.id === 'toggleMute'){ toggleMute(); }
    });

    // --- Xử lý đường tim SVG ---
    const SVG_NS = "http://www.w3.org/2000/svg";
    const shape = document.getElementById('shape');
    const partialPath = document.getElementById('partialPath');
    const pathlength = shape.getTotalLength();
    let t = 0; 
    let d = shape.getAttribute("d");
    let n = d.match(/C/gi).length;
    let pos = 0;

    class subPath {
      constructor(d) {
        this.d = d;
        this.get_PointsRy();
        this.previous = subpaths.length > 0 ? subpaths[subpaths.length - 1] : null;
        this.measurePath();
        this.get_M_Point();
        this.get_lastCubicBezier();
      }
      get_PointsRy(){
        this.pointsRy = [];
        let temp = this.d.split(/[A-Z,a-z\s,]/).filter(v=>v);
        temp.map(item=>this.pointsRy.push(parseFloat(item)));
      }
      measurePath(){
        let path = document.createElementNS(SVG_NS,"path");
        path.setAttributeNS(null,"d",this.d);
        this.pathLength = path.getTotalLength();
      }
      get_M_Point(){
        if(this.previous){
          let p = this.previous.pointsRy, l = p.length;
          this.M_point = [p[l-2], p[l-1]];
        } else {
          let p = this.pointsRy; this.M_point = [p[0], p[1]];
        }
      }
      get_lastCubicBezier(){
        let lastIndexOfC = this.d.lastIndexOf("C");
        let temp = this.d.substring(lastIndexOfC+1).split(/[\s,]/).filter(v=>v);
        let _temp = []; temp.map(item=>_temp.push(parseFloat(item)));
        this.lastCubicBezier = [this.M_point];
        for(let i=0;i<_temp.length;i+=2){ this.lastCubicBezier.push(_temp.slice(i,i+2)); }
      }
    }

    let subpaths = [];
    for(let i=0;i<n;i++){
      let newpos = d.indexOf("C", pos+1);
      if(i>0){ subpaths.push(new subPath(d.substring(0,newpos))); }
      pos = newpos;
    }
    subpaths.push(new subPath(d));

    function get_T_byProgress(progress){
      const lengthAtT = pathlength * progress;
      let index = 0;
      for(index=0; index<subpaths.length; index++){
        if(subpaths[index].pathLength >= lengthAtT) break;
      }
      let T;
      if(index > 0){
        T = (lengthAtT - subpaths[index].previous.pathLength) / (subpaths[index].pathLength - subpaths[index].previous.pathLength);
      } else {
        T = lengthAtT / subpaths[index].pathLength;
      }
      return { T, index };
    }

    function lerp(A,B,t){ return [ (B[0]-A[0])*t + A[0], (B[1]-A[1])*t + A[1] ]; }
    function getBezierPoints(t, pts){
      let h=[]; for(let i=1;i<4;i++){ h.push(lerp(pts[i-1], pts[i], t)); }
      h.push(lerp(h[0],h[1],t)); h.push(lerp(h[1],h[2],t)); h.push(lerp(h[3],h[4],t));
      return [pts[0], h[0], h[3], h[5]];
    }
    function drawCBezier(points, path, index){
      let D = (index>0) ? subpaths[index].previous.d : `M${points[0][0]},${points[0][1]} C`;
      for(let i=1;i<4;i++){ D += ` ${points[i][0]},${points[i][1]} `; }
      path.setAttributeNS(null,"d", D);
    }
    function setHeartProgress(progress){
      progress = Math.max(0, Math.min(1, progress));
      const {T, index} = get_T_byProgress(progress);
      const newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);
      drawCBezier(newPoints, partialPath, index);
      t = progress;
    }

    setTimeout(()=>{ document.querySelector("#text-click").style.display="inherit"; }, 4000);

    document.querySelector("#rose-t").onclick = function(){
      document.querySelector("#rose-t").style.display="none";
      document.querySelector("#castle").style.display="flex";
      document.querySelector("#theSvg").style.display="inherit";
      setHeartProgress(0); 
    };

    // Animation cho bông hồng
    (function(){
      var leafOne = document.querySelector('.leafOne');
      var stickLine = document.querySelector('.stickLine');
      var leafTwo = document.querySelector('.leafTwo');
      var leafS1 = document.querySelector('.leafS1');
      var rose1 = document.querySelector('.rose1');
      var rose2 = document.querySelector('.rose2');
      var rose3 = document.querySelector('.rose3');
      var rose4 = document.querySelector('.rose4');

      anime({
        targets:[leafOne, stickLine, leafTwo, leafS1, rose1, rose2, rose3, rose4],
        strokeDashoffset:[anime.setDashoffset, 0],
        easing:'easeInOutCubic',
        duration:4000,
        begin:function(){
          [leafOne,leafTwo,stickLine,leafS1,rose1,rose2,rose3,rose4].forEach(el=>{
            el.setAttribute("stroke","black"); el.setAttribute("fill","none");
          });
        },
        complete:function(){
          leafOne.setAttribute("fill","#9CDD05"); leafOne.setAttribute("stroke","none");
          leafTwo.setAttribute("fill","#9CDD05"); leafTwo.setAttribute("stroke","none");
          stickLine.setAttribute("fill","#83AA2E"); stickLine.setAttribute("stroke","none");
          leafS1.setAttribute("fill","#9CDD05"); leafS1.setAttribute("stroke","none");
          rose1.setAttribute("fill","#F37D79"); rose1.setAttribute("stroke","none");
          rose2.setAttribute("fill","#D86666"); rose2.setAttribute("stroke","none");
          rose3.setAttribute("fill","#F37D79"); rose3.setAttribute("stroke","none");
          rose4.setAttribute("fill","#D86666"); rose4.setAttribute("stroke","none");
        },
        autoplay:true
      });
    })();

    // --- Hiệu ứng gõ chữ và chạy nhạc ---
    const textTitleEl = document.querySelector('.textLetter h2');
    const textBodyEl  = document.querySelector('.contentLetter');

    const textLetterH2 = "Nchauu gửi em pthuyy yeu dau!";
    const textLetterP = `Gửi em, cô gái anh thương. ❤️
Anh không biết phải bắt đầu những lời này như thế nào cho thật hay, nhưng anh mong em sẽ cảm nhận được tất cả sự chân thành của anh khi đọc chúng.
Nhân ngày 20/10, anh chúc em luôn vui vẻ, bình an và có thật nhiều niềm vui trong cuộc sống. Anh biết em là một cô gái luôn cố gắng, chăm chỉ và nghiêm túc với những điều mình muốn làm. Anh cũng biết em luôn cố gắng để không làm anh buồn, không muốn anh phải tổn thương. Anh thật sự trân trọng những điều ấy, kể cả những điều nhỏ bé mà có thể em nghĩ anh không để ý. Anh mong em cũng sẽ dành cho bản thân sự dịu dàng mà em vẫn luôn dành cho anh, đừng quá áp lực, đừng vì muốn làm tốt mọi thứ mà quên mất mình cũng cần được nghỉ ngơi và yêu thương.
Anh mong em sẽ đạt được tất cả những điều em đang cố gắng, từng bước tiến gần hơn đến ước mơ của mình. Và hơn hết, anh mong rằng trên hành trình ấy, anh vẫn có thể ở bên em, cùng em cố gắng, cùng em trưởng thành và cùng nhau biến những điều chúng ta từng mong muốn thành sự thật. Anh biết yêu xa không phải lúc nào cũng dễ dàng, nhưng anh tin rằng chỉ cần cả hai luôn chân thành, tin tưởng và cùng hướng về nhau, chúng ta sẽ có thể vượt qua những khoảng cách này.
Anh không mong mình chỉ là người khiến em vui trong những ngày hạnh phúc, mà còn muốn trở thành người em có thể tìm đến khi mệt mỏi, khi áp lực hay khi cảm thấy chẳng có ai để sẻ chia. Anh muốn em biết rằng em không cần phải lúc nào cũng mạnh mẽ, cũng không cần phải cố gắng làm mọi thứ thật hoàn hảo. Với anh, em vẫn luôn đáng được yêu thương, kể cả những ngày em chẳng làm được gì như mong đợi.
Điều anh mong nhất không chỉ là được chúc em hạnh phúc trong ngày 20/10, mà còn là có thể đồng hành cùng em qua thật nhiều ngày 20/10 sau này. Anh muốn được nhìn thấy em trưởng thành, được tự hào về những gì em đạt được, được nghe em kể về những điều nhỏ nhặt mỗi ngày và được ở cạnh em khi chúng ta cuối cùng có thể thu hẹp khoảng cách giữa hai đứa.
Cảm ơn em vì đã xuất hiện trong cuộc đời anh, vì đã yêu anh và vì luôn cố gắng gìn giữ tình cảm của chúng ta. Anh biết mình và em vẫn còn nhiều điều phải học, nhưng anh thật lòng muốn cùng em học cách yêu thương nhau tốt hơn mỗi ngày.
Chúc cô gái của anh có một ngày 20/10 thật hạnh phúc. Mong em luôn giữ được nụ cười, sự cố gắng và những điều đẹp đẽ thuộc về em. Em cứ yên tâm bước về phía những ước mơ của mình nhé, anh cũng sẽ cố gắng cho tương lai của anh và cho cả tương lai mà anh mong có em trong đó.
Anh thương em nhiều lắm. Và nếu được mong cầu một điều cho tình yêu của chúng ta, anh chỉ mong rằng sau tất cả những cố gắng của hôm nay, người anh vẫn có thể nắm tay và cùng đi thật lâu sẽ luôn là em.
Yêu em, thật lòng. ❤️`;

    const speedTitle = 150; 
    const speedBody  = 45;  

    function typeWriter(el, text, speed, onTick, onDone){
      el.textContent = '';
      let i = 0;
      (function step(){
        if(i < text.length){
          el.textContent += text.charAt(i++);
          if(typeof onTick === 'function') onTick(i, text.length);
          if(el === textBodyEl){ el.scrollTop = el.scrollHeight; }
          setTimeout(step, speed);
        } else if(typeof onDone === 'function'){ onDone(); }
      })();
    }

    function openLetter(){
      $(".wrapperLetterForm").fadeIn();
      playBGM(); // Gọi hàm phát nhạc

      typeWriter(textTitleEl, textLetterH2, speedTitle, null, function(){
        typeWriter(
          textBodyEl,
          textLetterP,
          speedBody,
          (i, L)=>{
            const progress = 0.02 + 0.98 * (i / L);
            setHeartProgress(progress);
          },
          null
        );
      });
    }

    $(document).ready(function(){
      $('.valentines').mouseenter(function(){$('.card').stop().animate({ top:'-90px' }, 'slow');
      }).mouseleave(function(){
        $('.card').stop().animate({ top:0 }, 'slow');
      });

      $('.card').click(function(){ openLetter(); });

      $('.fa-xmark').click(function(){$('.wrapperLetterForm').css('display','none');
        stopBGM();
      });
    });
  </script>
</body>
